name: Build PhiskVideos Android v1.14.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: locate_project
        run: |
          ANDROID_DIR=$(find . \\( -name settings.gradle -o -name settings.gradle.kts \\) \\
            -not -path '*/.gradle/*' \\
            -not -path '*/build/*' \\
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"
          ls -la "$ANDROID_DIR"

      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing KEY_PASSWORD" && exit 1)

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          test -s "$RUNNER_TEMP/phiskvideos-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Get SHA-256 Signing Fingerprint
        run: |
          keytool -exportcert \\
            -keystore "$ANDROID_KEYSTORE_PATH" \\
            -alias "$KEY_ALIAS" \\
            -storepass "$KEYSTORE_PASSWORD" \\
            | openssl x509 -inform DER -noout -fingerprint -sha256

      - name: Build signed APK and Android App Bundle
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon clean assembleRelease bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PhiskVideos-Android-v1.14.1
          path: |
            **/app/build/outputs/apk/release/*.apk
            **/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
