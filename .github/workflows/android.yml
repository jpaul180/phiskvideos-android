name: Build PhiskVideos Android v1.19.1 (Native Explore Homepage Polish)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v1.19.1 Native Explore homepage redesign source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="PhiskVideos-Android-v1.19.0-Native-Explore2.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Missing $ARCHIVE. Upload the updated source ZIP to the repository root."
            echo "Repository root files:"
            ls -la
            exit 1
          fi
          echo "SOURCE_ARCHIVE=${ARCHIVE%.zip}" >> "$GITHUB_ENV"
          unzip -o "$ARCHIVE" -d . -x ".github/workflows/android.yml"

          # Android resource filenames cannot contain hyphens. Normalize any
          # supplied resource filenames and their source-code references.
          PROJECT_ROOT="."
          if [[ -d android/app/src/main/res ]]; then PROJECT_ROOT="android"; fi
          RES_DIR="$PROJECT_ROOT/app/src/main/res"
          if [[ -d "$RES_DIR" ]]; then
            while IFS= read -r -d '' FILE; do
              BASE="$(basename "$FILE")"
              FIXED="${BASE//-/_}"
              if [[ "$BASE" != "$FIXED" ]]; then
                DIR="$(dirname "$FILE")"
                mv "$FILE" "$DIR/$FIXED"
                OLD_REF="${BASE%.*}"
                NEW_REF="${FIXED%.*}"
                find "$PROJECT_ROOT/app/src" -type f -print0 | while IFS= read -r -d '' SOURCE; do
                  if file "$SOURCE" | grep -q text; then
                    sed -i "s/$OLD_REF/$NEW_REF/g" "$SOURCE"
                  fi
                done
              fi
            done < <(find "$RES_DIR" -type f -name '*-*' -print0)
          fi

          if [[ -f android/settings.gradle && -f android/app/build.gradle ]]; then
            echo "ANDROID_PROJECT_DIR=android" >> "$GITHUB_ENV"
          elif [[ -f settings.gradle && -f app/build.gradle ]]; then
            echo "ANDROID_PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::Could not locate the Android Gradle project after extracting $ARCHIVE."
            find . -maxdepth 4 \( -name settings.gradle -o -name build.gradle \) -print
            exit 1
          fi

      - name: Apply v1.19.1 release version and retain startup crash fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/co/phisk/videos/MainActivity.java")
          source = p.read_text()
          old = "@Override protected void onDestroy() { downloadExecutor.shutdown(); authExecutor.shutdown(); web.destroy(); super.onDestroy(); }"
          new = """@Override protected void onDestroy() {
                  downloadExecutor.shutdown();
                  authExecutor.shutdown();
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }"""
          if old in source:
              p.write_text(source.replace(old, new, 1))
              print("Applied legacy WebView destruction safety fix.")
          elif "web != null" in source and "web = null;" in source:
              print("WebView destruction safety fix is already present; no patch needed.")
          else:
              print("Source has a different onDestroy implementation; leaving it unchanged rather than applying an unsafe text patch.")
          g = Path("app/build.gradle")
          build = g.read_text()
          build, name_count = re.subn(r"versionName\s+'[^']+'", "versionName '1.19.1'", build, count=1)
          build, code_count = re.subn(r"versionCode\s+\\d+", "versionCode 45", build, count=1)
          if name_count != 1 or code_count != 1:
              raise SystemExit(f"Could not safely set release version (versionName matches={name_count}, versionCode matches={code_count}).")
          g.write_text(build)
          PY
          grep -q "versionName '1.19.1'" app/build.gradle
          grep -q 'versionCode 45' app/build.gradle

      - name: Verify v1.19.1 Native Explore homepage polish and preserved onboarding
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"

          test -f app/src/main/res/layout/view_phisk_player.xml
          test -f app/src/main/java/co/phisk/videos/NativeSettingsActivity.java
          test -f app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'NativeAccountSettingsActivity' app/src/main/AndroidManifest.xml
          grep -q 'NativeAccountSettingsActivity.class' app/src/main/java/co/phisk/videos/NativeSettingsActivity.java

          test -f app/src/main/java/co/phisk/videos/PhiskTheme.java
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/values/ids.xml
          test -f app/src/main/res/drawable-nodpi/ic_settings_user_hexagon.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_user_edit.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_lock.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_spy.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_wifi_off.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_brightness_half.png
          test -f app/src/main/res/drawable-nodpi/ic_settings_logout.png

          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n1)"
          [[ "$VERSION_NAME" == "1.19.1" ]] || { echo "::error::Expected Android version 1.19.1, found: $VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" == "45" ]] || { echo "::error::Expected Android versionCode 45, found: $VERSION_CODE"; exit 1; }
          test -n "$VERSION_CODE"

          SETTINGS="app/src/main/java/co/phisk/videos/NativeSettingsActivity.java"
          grep -q 'Edit profile' "$SETTINGS"
          grep -q 'Password & security' "$SETTINGS"
          grep -q 'Privacy & account' "$SETTINGS"
          grep -q 'Log out' "$SETTINGS"
          grep -q 'dark_mode' "$SETTINGS"
          grep -q 'confirmLogout' "$SETTINGS"
          grep -q 'app-auth/logout' "$SETTINGS"

          grep -q 'wp-json/phisk/v1/account-settings' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'Bearer ' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'username' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'first_name' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'last_name' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'phone_number' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java
          grep -q 'PhiskTheme.apply(this)' app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java

          ACCOUNT="app/src/main/java/co/phisk/videos/NativeAccountSettingsActivity.java"
          grep -q 'username-availability' "$ACCOUNT"
          grep -q 'account-settings/profile-image' "$ACCOUNT"
          grep -q 'Change Profile Image' "$ACCOUNT"
          grep -q 'phisk_profile_image_id' "$ACCOUNT" || grep -q 'profile-image' "$ACCOUNT"
          grep -q 'scheduleUsernameCheck' "$ACCOUNT"
          grep -q 'usernameCheckPending' "$ACCOUNT"
          grep -q 'first_name' "$ACCOUNT"
          grep -q 'last_name' "$ACCOUNT"
          grep -q 'phone_number' "$ACCOUNT"

          grep -q 'a.optString("username"' app/src/main/java/co/phisk/videos/NativeSettingsActivity.java

          # Creator Studio v1.17.2: dashboard shortcuts removed, selection states,
          # chart entrance animation and rounded bar tops, HTML title decoding,
          # and channel-less users routed to native channel creation.
          STUDIO="app/src/main/java/co/phisk/videos/NativeCreatorStudioActivity.java"
          test -f "$STUDIO"
          grep -q 'creator-channel' "$STUDIO"
          grep -q 'NativeCreatorChannelEditorActivity.class' "$STUDIO"
          grep -q 'REQUEST_CREATE_CHANNEL' "$STUDIO"
          grep -q 'addChoice' "$STUDIO"
          grep -q 'updateChoices' "$STUDIO"
          grep -q 'styleChoice' "$STUDIO"
          grep -q 'animateBars' "$STUDIO"
          grep -q 'maybeAnimateChart' "$STUDIO"
          grep -q 'ValueAnimator.ofFloat(0f,1f)' "$STUDIO"
          grep -q 'quadTo(x,y,x+radius,y)' "$STUDIO"
          grep -q 'Html.fromHtml' "$STUDIO"
          grep -q 'decodeTitle' "$STUDIO"
          ! grep -q 'Upload video' "$STUDIO"
          ! grep -q 'Write a Story' "$STUDIO"
          grep -q 'versionName '\''1.19.1'\''' app/build.gradle
          grep -q 'versionCode 45' app/build.gradle

          # Native onboarding v1.18.0: verify the three approved onboarding
          # experiences are present in the extracted Android source/resources.
          ONBOARDING_ROOT="app/src/main"
          test -d "$ONBOARDING_ROOT"
          grep -R -F -q "Welcome to PhiskVideos!" "$ONBOARDING_ROOT"
          grep -R -F -q "Your Voice Deserves to Be Heard!" "$ONBOARDING_ROOT"
          grep -R -F -q "Welcome to Creator Studio!" "$ONBOARDING_ROOT"
          grep -R -F -q "Explore Creator Studio" "$ONBOARDING_ROOT"
          grep -R -F -q "Create Your Channel" "$ONBOARDING_ROOT"
          grep -R -F -q "Get Started" "$ONBOARDING_ROOT"


          # Native Explore v1.19.1: dynamic configuration, section feeds,
          # category detail screen, navigation ordering, and fixed carousel cards.
          HOME="app/src/main/java/co/phisk/videos/NativeHomeActivity.java"
          CATEGORY="app/src/main/java/co/phisk/videos/NativeCategoryActivity.java"
          test -f "$HOME"
          test -f "$CATEGORY"
          grep -q '"Explore","For You"' "$HOME"
          grep -q 'explore/config' "$HOME"
          grep -q 'explore/sections/' "$HOME"
          grep -q 'NativeCategoryActivity.class' "$HOME"
          grep -q 'thumbnail_url' "$HOME"
          grep -q 'avatar_url' "$HOME"
          grep -q 'Views' "$HOME"
          grep -q 'setMaxLines(2)' "$HOME"
          grep -q 'TextUtils.TruncateAt.END' "$HOME"
          # Homepage polish: verify the native share action and share drawable exist.
          grep -R -i -q 'share' "$HOME"
          find app/src/main/res -type f | grep -Eiq 'share|ic_share'
          grep -q 'categories/' "$CATEGORY"
          grep -q 'per_page=10' "$CATEGORY"
          grep -q 'NativeCategoryActivity' app/src/main/AndroidManifest.xml

          # Verify persisted app-wide theme integration across native screens and WebView.
          THEME="app/src/main/java/co/phisk/videos/PhiskTheme.java"
          SETTINGS="app/src/main/java/co/phisk/videos/NativeSettingsActivity.java"
          MAIN="app/src/main/java/co/phisk/videos/MainActivity.java"
          grep -q 'dark_mode' "$THEME"
          grep -q 'SharedPreferences' "$THEME"
          grep -q 'AppTheme_Dark' "$THEME"
          grep -q 'darkCss' "$THEME"
          grep -q 'PhiskTheme.setDark' "$SETTINGS"
          grep -q 'PhiskTheme.configureActivityTheme' "$MAIN"
          grep -q 'PhiskTheme.apply(this)' "$MAIN"
          for SCREEN in NativeHomeActivity NativeSearchActivity NativePlayerActivity NativeCreatorChannelActivity NativeCreatorStudioActivity NativeStoryCreateActivity NotificationCentreActivity DownloadsActivity OfflineVideoActivity NativeVideoUploadActivity NativeReportVideoActivity; do
            FILE="app/src/main/java/co/phisk/videos/${SCREEN}.java"
            if [[ -f "$FILE" ]]; then
              grep -q 'PhiskTheme.configureActivityTheme' "$FILE" || { echo "::error::Missing theme setup in $SCREEN"; exit 1; }
              grep -q 'PhiskTheme.apply(this)' "$FILE" || { echo "::error::Missing theme refresh in $SCREEN"; exit 1; }
            fi
          done

          ! grep -R -E 'PictureInPicture|enterPictureInPictureMode|supportsPictureInPicture|onUserLeaveHint|navigateWithMiniPlayer' \
            app/src/main/java/co/phisk/videos/NativePlayerActivity.java \
            app/src/main/java/co/phisk/videos/OfflineVideoActivity.java \
            app/src/main/AndroidManifest.xml

      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: cd "$ANDROID_PROJECT_DIR" && gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_ARCHIVE }}-Build
          path: |
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
