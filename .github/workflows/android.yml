name: Build PhiskVideos Android v1.16.4 - Fullscreen Playback Restore

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract v1.16.4 source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="PhiskVideos-Android-v1.16.4-Fullscreen-Playback-Restore.zip"
          test -f "$ARCHIVE" || { echo "::error::Missing $ARCHIVE in repository root."; exit 1; }
          unzip -o "$ARCHIVE" -d . -x ".github/workflows/android.yml"

      - name: Ensure DownloadsActivity Intent import
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/co/phisk/videos/DownloadsActivity.java"
          test -f "$FILE"
          if ! grep -q '^import android.content.Intent;' "$FILE"; then
            sed -i '/^package .*;/a import android.content.Intent;' "$FILE"
          fi
          grep -q '^import android.content.Intent;' "$FILE"
          echo "Verified DownloadsActivity Intent import."

      - name: Verify v1.16.4 full-screen playback source
        run: |
          set -euo pipefail
          test -f app/src/main/res/layout/view_phisk_player.xml
          grep -q "versionName '1.16.4'" app/build.gradle
          grep -q 'versionCode 33' app/build.gradle
          ! grep -R -E 'PictureInPicture|enterPictureInPictureMode|supportsPictureInPicture|onUserLeaveHint|navigateWithMiniPlayer' app/src/main/java/co/phisk/videos/NativePlayerActivity.java app/src/main/java/co/phisk/videos/OfflineVideoActivity.java app/src/main/AndroidManifest.xml
      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        run: gradle --no-daemon --stacktrace clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PhiskVideos-Android-v1.16.4-Fullscreen-Playback-Restore
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
