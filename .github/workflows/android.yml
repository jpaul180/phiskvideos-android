name: Build PhiskVideos Android v1.14.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source archive
        run: |
          SOURCE_ZIP="PhiskVideos-v1.14.1-AVATAR-FIX-SOURCE.zip"
          LEGACY_SOURCE_ZIP="PhiskVideos-v1.14.1-UPDATED-SOURCE.zip"

          if [ -f "$SOURCE_ZIP" ]; then
            SELECTED_SOURCE="$SOURCE_ZIP"
          elif [ -f "$LEGACY_SOURCE_ZIP" ]; then
            echo "::warning::Avatar-fix source archive not found; using legacy source archive."
            SELECTED_SOURCE="$LEGACY_SOURCE_ZIP"
          else
            echo "::error::Neither expected source archive was found."
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using source archive: $SELECTED_SOURCE"
          mkdir -p android-build-source
          unzip -q "$SELECTED_SOURCE" -d android-build-source

          SETTINGS_FILE=$(find android-build-source -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Extracted archive does not contain a Gradle settings file."
            find android-build-source -maxdepth 4 -type f -name 'settings.gradle*' -print
            exit 1
          fi

          APP_BUILD_FILE=$(find android-build-source -maxdepth 4 -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)
          if [ -z "$APP_BUILD_FILE" ]; then
            echo "::error::Extracted archive does not contain app/build.gradle or app/build.gradle.kts."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          if [ "$PROJECT_ROOT" != "android-build-source" ]; then
            echo "::error::Source archive contains an unexpected nested project root: $PROJECT_ROOT"
            exit 1
          fi

          echo "Android source extracted and structure validated."
          ls -la android-build-source

      - name: Set Android version to v1.14.1
        working-directory: android-build-source
        run: |
          if [ -f app/build.gradle ]; then
            sed -i "s/versionCode [0-9]*/versionCode 28/" app/build.gradle
            sed -i "s/versionName '[^']*'/versionName '1.14.1'/" app/build.gradle
          else
            sed -i 's/versionCode [0-9]*/versionCode 28/' app/build.gradle.kts
            sed -i 's/versionName = "[^"]*"/versionName = "1.14.1"/' app/build.gradle.kts
          fi
          grep -nE 'versionCode|versionName' app/build.gradle* || true

      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing KEY_PASSWORD" && exit 1)

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          test -s "$RUNNER_TEMP/phiskvideos-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Get SHA-256 Signing Fingerprint
        run: keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | openssl x509 -inform DER -noout -fingerprint -sha256

      - name: Build signed APK and Android App Bundle
        working-directory: android-build-source
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PhiskVideos-Android-v1.14.1-Avatar-Fix
          path: |
            android-build-source/app/build/outputs/apk/release/*.apk
            android-build-source/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
