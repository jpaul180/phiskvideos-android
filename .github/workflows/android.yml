name: Build PhiskVideos Android v1.16.0 - Offline Video Experience

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and extract v1.16.0 source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="PhiskVideos-Android-v1.16.0-Offline-Video-Experience.zip"

          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "::error::Missing $SOURCE_ZIP in the repository root."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Extracting $SOURCE_ZIP"
          # Keep the repository's active workflow instead of replacing it
          # with the copy bundled inside the source archive.
          unzip -o "$SOURCE_ZIP" -d . -x ".github/workflows/android.yml"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/google-services.json

          grep -q "versionName '1.16.0'" app/build.gradle
          grep -q 'versionCode 29' app/build.gradle

          echo "Source structure and Android version verified."
          echo "Gradle plugin configuration:"
          cat build.gradle
          echo "App version:"
          grep -nE 'versionCode|versionName|compileSdk|minSdk|targetSdk' app/build.gradle

      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || (echo "::error::Missing KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Missing KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing KEY_PASSWORD" && exit 1)

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          test -s "$RUNNER_TEMP/phiskvideos-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Display release signing certificate fingerprint
        run: |
          keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" |
            openssl x509 -inform DER -noout -fingerprint -sha256

      - name: Build release APK and Android App Bundle
        run: gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: PhiskVideos-Android-v1.16.0-Offline-Video-Experience
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
