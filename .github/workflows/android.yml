
name: Build PhiskVideos Android 1.3.9

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply PhiskVideos Android source archive
        run: |
          ARCHIVE="PhiskVideos-Android-v1.3.9-Stage-2-FCM-Foundation.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Missing $ARCHIVE at the repository root."
            exit 1
          fi
          unzip -o "$ARCHIVE" -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          test -s "$RUNNER_TEMP/phiskvideos-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PhiskVideos-Android-v1.3.9-FCM-Foundation
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
