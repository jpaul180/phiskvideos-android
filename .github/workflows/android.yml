name: Build PhiskVideos Android (latest v1.16.x source archive)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract latest v1.16.x source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'PhiskVideos-Android-v1.16.*.zip' -printf '%f\n' | sort -V | tail -n1)"
          test -n "$ARCHIVE" || { echo "::error::No PhiskVideos-Android-v1.16.x source archive found in repository root."; exit 1; }
          echo "SOURCE_ARCHIVE=${ARCHIVE%.zip}" >> "$GITHUB_ENV"
          unzip -o "$ARCHIVE" -d . -x ".github/workflows/android.yml"

      - name: Verify Android source and release version
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/res/layout/view_phisk_player.xml
          VERSION_NAME="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n "s/.*versionCode \\([0-9][0-9]*\\).*/\\1/p" app/build.gradle | head -n1)"
          [[ "$VERSION_NAME" =~ ^1\.16\.[0-9]+$ ]] || { echo "::error::Unexpected Android version: $VERSION_NAME"; exit 1; }
          test -n "$VERSION_CODE"
          if [[ "$VERSION_NAME" == "1.16.5" ]]; then
            test -f app/src/main/res/drawable/phisk_home.xml
            test -f app/src/main/res/drawable/phisk_share_white.xml
            test -f app/src/main/res/drawable/phisk_subscribe.xml
            grep -q "share.setOnClickListener(v->shareVideo(item))" app/src/main/java/co/phisk/videos/NativeHomeActivity.java
            grep -q "toggleSubscribe()" app/src/main/java/co/phisk/videos/NativePlayerActivity.java
          fi
          ! grep -R -E 'PictureInPicture|enterPictureInPictureMode|supportsPictureInPicture|onUserLeaveHint|navigateWithMiniPlayer' app/src/main/java/co/phisk/videos/NativePlayerActivity.java app/src/main/java/co/phisk/videos/OfflineVideoActivity.java app/src/main/AndroidManifest.xml
      - name: Prepare Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phiskvideos-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/phiskvideos-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        run: gradle --no-daemon --stacktrace clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_ARCHIVE }}-Build
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
